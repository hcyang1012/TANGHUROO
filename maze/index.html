<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>별사탕 미로</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="hud" aria-live="polite">
      <div class="badge">미로 게임</div>
      <h1>별사탕 미로</h1>
      <p id="status">방향키나 스와이프로 움직여서 오른쪽 아래의 별까지 가 보자.</p>

      <div class="controls">
        <button id="newMazeBtn" type="button">새 미로</button>
        <button id="easyBtn" type="button" class="ghost">크게 보기</button>
      </div>

      <div class="tips">
        <div><b>PC</b> 방향키 / WASD</div>
        <div><b>모바일</b> 아래 패드 또는 스와이프</div>
      </div>
    </section>

    <div class="mobile-dock" aria-label="모바일 빠른 조작">
      <button type="button" data-action="restart">새 미로</button>
      <button type="button" data-action="difficulty">크게 보기</button>
    </div>

    <section class="stage">
      <div class="board-frame">
        <canvas id="game" aria-label="미로 게임 화면"></canvas>
        <div class="overlay" id="overlay">
          <span class="overlay-title">준비 완료</span>
          <span class="overlay-text">시작 버튼을 누르거나 스페이스를 눌러 시작해요.</span>
        </div>
      </div>

      <div class="legend">
        <span><i class="dot player"></i> 나</span>
        <span><i class="dot goal"></i> 별</span>
      </div>

      <div class="mobile-controls" aria-label="모바일 조작">
        <button type="button" class="dir-btn up" data-dir="up" aria-label="위로 이동">▲</button>
        <div class="middle-row">
          <button type="button" class="dir-btn left" data-dir="left" aria-label="왼쪽으로 이동">◀</button>
          <button type="button" class="dir-btn restart" data-action="restart" aria-label="다시 시작">↻</button>
          <button type="button" class="dir-btn right" data-dir="right" aria-label="오른쪽으로 이동">▶</button>
        </div>
        <button type="button" class="dir-btn down" data-dir="down" aria-label="아래로 이동">▼</button>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
