<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>별사탕 미로</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="hud" aria-live="polite">
      <div class="badge">4세용 미로 게임</div>
      <h1>별사탕 미로</h1>
      <p id="status">왼쪽 스틱이나 방향키로 움직여서 반짝이는 별까지 가 보자.</p>

      <div class="controls">
        <button id="newMazeBtn" type="button">새 미로</button>
        <button id="easyBtn" type="button" class="ghost">더 쉽고 크게</button>
      </div>

      <div class="tips">
        <div><b>게임패드</b> 왼쪽 스틱 / 십자키</div>
        <div><b>A 버튼</b> 다시 시작</div>
      </div>
    </section>

    <section class="stage">
      <canvas id="game" aria-label="미로 게임 화면"></canvas>
      <div class="legend">
        <span><i class="dot player"></i> 나</span>
        <span><i class="dot goal"></i> 별</span>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
