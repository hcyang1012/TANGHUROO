<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>스네이크 게임</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="eyebrow">1인용 스네이크</div>
      <h1>먹이를 먹고, 더 길어지기!</h1>
      <p class="lede" id="message">
        방향키나 WASD로 움직여서 먹이를 먹고 길어지세요. 벽에 부딪히면 다시 시작해야 해요.
      </p>

      <div class="stats" aria-live="polite">
        <div class="stat">
          <span class="label">점수</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span class="label">최고</span>
          <strong id="best">0</strong>
        </div>
        <div class="stat">
          <span class="label">속도</span>
          <strong id="speed">1</strong>
        </div>
      </div>

      <div class="actions">
        <button id="startBtn" type="button">시작 / 다시하기</button>
        <button id="soundBtn" type="button" class="secondary">소리 끄기</button>
      </div>

      <div class="help">
        <div><b>조작</b> 방향키 / WASD</div>
        <div><b>목표</b> 먹이를 계속 먹기</div>
        <div><b>팁</b> 너무 빨리 돌면 꼬리에 부딪혀요</div>
      </div>
    </section>

    <section class="stage">
      <div class="board-wrap">
        <canvas id="game" aria-label="스네이크 게임 화면"></canvas>
        <div class="overlay" id="overlay">
          <span class="overlay-title">준비 완료</span>
          <span class="overlay-text">시작 버튼을 누르거나 스페이스를 눌러 시작해요.</span>
        </div>
      </div>

      <div class="touch-controls" aria-label="모바일 조작">
        <button data-dir="up" class="pad top" aria-label="위로 이동">▲</button>
        <div class="pad-row">
          <button data-dir="left" class="pad" aria-label="왼쪽으로 이동">◀</button>
          <button data-dir="down" class="pad" aria-label="아래로 이동">▼</button>
          <button data-dir="right" class="pad" aria-label="오른쪽으로 이동">▶</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
